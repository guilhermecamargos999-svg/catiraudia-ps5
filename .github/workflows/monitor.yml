name: Monitor PS5
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Modo de execução
        type: choice
        default: validar
        options: [validar, telegram, monitorar]
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
permissions:
  contents: write
concurrency:
  group: monitor-ps5
  cancel-in-progress: false
jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
        if: inputs.mode != 'telegram'
        timeout-minutes: 4
      - name: Executar
        run: node monitor.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.mode == 'telegram' }}
          DRY_RUN: ${{ !(inputs.mode == 'monitorar' || github.event_name == 'schedule') }}
      - name: Salvar anúncios já vistos
        if: always()
        shell: bash
        run: |
          if [ -f state/seen.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state/seen.json
            if ! git diff --cached --quiet; then
              git commit -m 'Atualizar anúncios já vistos'
              git push
            fi
          fi

